server {
    listen 80;
    listen [::]:80;

    server_name admin.jarlhalla.com;

    root /var/www/admin.jarlhalla.com;
    index index.html;

    # Authentication is intentionally scoped to application locations instead
    # of the whole server block. This lets Certbot's temporary ACME challenge
    # location remain reachable during initial issuance and renewals.
    location = /wordpress {
        auth_basic "Jarlhalla Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-jarlhalla-admin;
        return 302 https://jarlhalla.com/wp-admin/;
    }

    location = /mail-admin {
        auth_basic "Jarlhalla Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-jarlhalla-admin;
        return 302 https://mail.jarlhalla.com/admin;
    }

    location /api/jarlhalla-ai/ {
        auth_basic "Jarlhalla Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-jarlhalla-admin;

        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        auth_basic "Jarlhalla Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-jarlhalla-admin;
        try_files $uri $uri/ /index.html;
    }
}
