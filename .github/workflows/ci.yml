name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Validate package
        run: npm run package

      - name: Run package and module contract tests
        run: python -m unittest discover -s tests/package -v

      - name: Run tests
        run: npm test -- --runInBand

  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: mbstring, zip
          tools: composer:v2

      - name: PHP info
        run: php -v

      - name: Composer info
        run: composer --version

      - name: Install PHP dev deps
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist
          else
            echo 'No composer.json found; skipping composer install'
          fi

      - name: PHP lint modules
        run: |
          set -e
          if [ -d modules ] || [ -d includes ]; then
            find modules includes -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
          fi

      - name: Run PHPStan (if installed)
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse modules includes --no-progress --memory-limit=2G
          else
            echo 'phpstan not installed; skipping'
          fi
      - name: Run isolated PHP regressions
        run: php tests/php/release_regressions.php

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check positive and negative analysis contracts
        run: python tests/phpstan/check_contract.py

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse modules includes --no-progress --memory-limit=2G

      - name: Run PHPUnit
        run: vendor/bin/phpunit --bootstrap tests/phpunit/bootstrap.php tests/phpunit

  php-minimum-lint:
    name: PHP 8.0 syntax compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.0'
      - run: find modules includes -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -l wp-site-suite.php
