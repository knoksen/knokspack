name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Run tests
        run: npm test --if-present

  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: PHP info
        run: php -v

      - name: Composer info
        run: composer --version

      - name: Install PHP dev deps
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist
          else
            echo 'No composer.json found; skipping composer install'
          fi

      - name: PHP lint modules
        run: |
          set -e
          if [ -d modules ] || [ -d includes ]; then
            find modules includes -name '*.php' -print0 | xargs -0 -n1 -P4 php -l
          fi

      - name: Run PHPStan (if installed)
        run: |
          if [ -f vendor/bin/phpstan ]; then
            vendor/bin/phpstan analyse modules includes --no-progress
          else
            echo 'phpstan not installed; skipping'
          fi

      - name: Run PHPUnit (if installed)
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --version
          else
            echo 'phpunit not installed; skipping'
          fi
