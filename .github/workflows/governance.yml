name: Offline governance validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/governance/**'
      - '.github/workflows/governance.yml'

permissions:
  contents: read

jobs:
  governance:
    name: Offline governance security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run isolated tests without service credentials
        working-directory: tools/governance
        run: python -m unittest discover -v
